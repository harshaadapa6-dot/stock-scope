name: stock_scope
description: StockScope - a stock comparison analyzer for educational use.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  fl_chart: ^0.69.0
  dio: ^5.4.3
  shared_preferences: ^2.2.3
  flutter_dotenv: ^5.1.0
  intl: '>=0.19.0 <1.0.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
